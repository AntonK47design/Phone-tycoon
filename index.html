<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1d3b" />
    <title>Phone Empire 3D</title>
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js" async></script>
    <style>
      html, body { margin: 0; height: 100%; background: #12142a; overflow: hidden; overscroll-behavior: none; }
      #app { position: fixed; inset: 0; }
      #loader {
        position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 40%, #2b3160 0%, #12142a 70%); color: #fff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; transition: opacity .6s ease;
      }
      #loader.hide { opacity: 0; pointer-events: none; }
      #loader .logo { font-weight: 800; font-size: 28px; letter-spacing: .02em; margin-bottom: 18px; }
      #loader .logo span { background: linear-gradient(90deg, #7fdcff, #b388ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #loader .bar { width: 220px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.12); overflow: hidden; }
      #loader .bar i { display: block; height: 100%; width: 30%; border-radius: 6px; background: linear-gradient(90deg, #58d6ff, #b388ff); animation: load 1.2s ease-in-out infinite; }
      @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <div id="loader"><div class="logo">Phone <span>Empire</span> 3D</div><div class="bar"><i></i></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
