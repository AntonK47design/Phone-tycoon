<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1f4a3c" />
    <title>Phone Empire 3D</title>
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js" async></script>
    <style>
      html, body { margin: 0; height: 100%; background: #1f4a3c; overflow: hidden; overscroll-behavior: none; }
      #app { position: fixed; inset: 0; }
      #loader {
        position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background-color: #1f4a3c; color: #f6efdf; font-family: 'Arial Black', Impact, system-ui, sans-serif; transition: opacity .5s ease;
        background-image: linear-gradient(rgba(214,236,220,.09) 1px, transparent 1px), linear-gradient(90deg, rgba(214,236,220,.09) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      #loader.hide { opacity: 0; pointer-events: none; }
      #loader .logo { font-size: 34px; letter-spacing: .02em; text-transform: uppercase; color: #ffd23f; text-shadow: 3px 3px 0 #1d1a16, 6px 6px 0 #ff5a1f; transform: rotate(-2deg); }
      #loader .bar { width: 240px; height: 16px; border: 3px solid #1d1a16; border-radius: 4px; background: #f6efdf; overflow: hidden; box-shadow: 4px 4px 0 #1d1a16; }
      #loader .bar i { display: block; height: 100%; width: 40%; background: repeating-linear-gradient(-45deg, #ff5a1f 0 10px, #ffd23f 10px 20px); animation: load 1.1s ease-in-out infinite alternate; }
      #loader p { margin: 0; font: 700 13px ui-monospace, Menlo, monospace; color: #cfe3d6; }
      @keyframes load { from { width: 15%; } to { width: 95%; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <div id="loader"><div class="logo">Phone Empire</div><div class="bar"><i></i></div><p>Sweeping the garage floor…</p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
